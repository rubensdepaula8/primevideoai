<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Vídeos IA - Simples e Rápido</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .logo p {
            color: #999;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }

        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
            font-family: Arial, sans-serif;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .btn-gerar {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 30px;
        }

        .btn-gerar:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-gerar:active {
            transform: translateY(0);
        }

        .btn-gerar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            min-height: 20px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .categorias-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .categoria-item {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            background: white;
        }

        .categoria-item:hover {
            border-color: #667eea;
            background: #f5f5ff;
        }

        .categoria-item.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .categoria-emoji {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .categoria-nome {
            font-size: 12px;
            font-weight: bold;
        }

        .success-message {
            display: none;
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }

        .error-message {
            display: none;
            background: #f44336;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }

        .duracao-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .duracao-btn {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            transition: all 0.3s;
            font-weight: bold;
        }

        .duracao-btn:hover {
            border-color: #667eea;
        }

        .duracao-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🎬 VideoIA</h1>
            <p>Gere vídeos com narração em segundos</p>
        </div>

        <form id="videoForm">
            <!-- CATEGORIA -->
            <div class="form-group">
                <label>Escolha um Tema:</label>
                <div class="categorias-grid" id="categoriasGrid"></div>
                <input type="hidden" id="selectedCategory" value="">
            </div>

            <!-- DURAÇÃO -->
            <div class="form-group">
                <label>Duração do Vídeo:</label>
                <div class="duracao-group">
                    <button type="button" class="duracao-btn selected" data-duracao="15">15s</button>
                    <button type="button" class="duracao-btn" data-duracao="30">30s</button>
                    <button type="button" class="duracao-btn" data-duracao="60">60s</button>
                </div>
                <input type="hidden" id="selectedDuracao" value="15">
            </div>

            <!-- TEMA VISUAL -->
            <div class="form-group">
                <label>Estilo Visual:</label>
                <select id="temaVisual">
                    <option value="animated">🎨 Animado (Círculos Giratórios)</option>
                    <option value="gradient">🌈 Gradiente (Cores Dinâmicas)</option>
                    <option value="particles">✨ Partículas (Efeito Bioluminescente)</option>
                    <option value="wave">〰️ Onda (Padrão Ondulatório)</option>
                    <option value="minimal">◆ Minimalista (Simples e Elegante)</option>
                </select>
            </div>

            <!-- BOTÃO GERAR -->
            <button type="submit" class="btn-gerar" id="gerarBtn">
                ✨ GERAR VÍDEO EM MP4
            </button>

            <!-- STATUS -->
            <div class="status" id="status"></div>

            <!-- MENSAGENS -->
            <div class="success-message" id="successMessage">
                ✅ Vídeo gerado com sucesso! Iniciando download...
            </div>
            <div class="error-message" id="errorMessage"></div>
        </form>
    </div>

    <script>
        const CATEGORIAS = {
            "natureza": { emoji: "🌍", nome: "Natureza" },
            "espaco": { emoji: "🪐", nome: "Espaço" },
            "animais": { emoji: "🦁", nome: "Animais" },
            "tecnologia": { emoji: "💻", nome: "Tecnologia" },
            "historia": { emoji: "📚", nome: "História" },
            "ciencia": { emoji: "🔬", nome: "Ciência" },
            "oceanos": { emoji: "🌊", nome: "Oceanos" },
            "geografia": { emoji: "🗺️", nome: "Geografia" },
            "corpo-humano": { emoji: "🫀", nome: "Corpo Humano" }
        };

        const ROTEIROS = {
            "natureza": "A natureza é um espetáculo de beleza e diversidade. Cada ecossistema possui sua própria história fascinante. Florestas, desertos, montanhas e rios trabalham em harmonia perfeita. A natureza nos ensina sobre resilência e renovação. Proteger a natureza é proteger nosso futuro.",
            "espaco": "O universo é vasto e infinito, cheio de mistérios. Bilhões de galáxias flutuam no espaço sideral. Buracos negros, estrelas de nêutrons e nebulosas coloridas. Estamos apenas começando a explorar o cosmos. O universo nos chama para descobrir seus segredos.",
            "animais": "O reino animal é diverso e fascinante. Desde insetos microscópicos até baleias gigantescas. Cada espécie evoluiu para se adaptar ao seu ambiente. Os animais mostram inteligência, instinto e emotividade. Preservar a vida selvagem é fundamental para o planeta.",
            "tecnologia": "A tecnologia revoluciona nosso mundo dia após dia. Inteligência artificial, computação quântica e energia limpa. Inovação que transforma como vivemos e trabalhamos. O futuro depende das escolhas tecnológicas que fazemos hoje. A tech é ferramenta para um mundo melhor.",
            "historia": "A história molda quem somos e para onde vamos. Civilizações antigas deixaram legados monumentais. Guerras, paz, arte e cultura se entrelaçam. Cada era tem suas lições para o presente. Conhecer a história é compreender nosso destino.",
            "ciencia": "A ciência desvendará os mistérios do universo. Do microscópico ao macroscópico, tudo segue leis naturais. Pesquisadores dedicados expandem nosso conhecimento. Física, química, biologia revolucionam nossa vida. A ciência é luz na escuridão do desconhecido.",
            "oceanos": "Os oceanos cobrem setenta por cento do planeta Terra. Ecossistemas marinhos vibrantes e misteriosos habitam as profundezas. Coral, peixes, baleias e criaturas fascinantes. Os oceanos regulam o clima e produzem oxigênio. Proteger os mares é essencial para a vida.",
            "geografia": "A geografia nos conecta ao nosso mundo. Montanhas, rios, cânions e planícies moldam paisagens. Diferentes clima e biomas ao redor do globo. Cada região tem sua identidade única. Explorar a geografia é explorar a humanidade.",
            "corpo-humano": "O corpo humano é uma máquina biológica perfeita. Trilhões de células trabalham em sincronismo. Cérebro, coração, pulmões, cada sistema vital. Nosso corpo se adapta, aprende e evolui. Compreender o corpo é compreender a vida."
        };

        // Renderizar categorias
        const categoriasGrid = document.getElementById('categoriasGrid');
        Object.entries(CATEGORIAS).forEach(([key, value]) => {
            const item = document.createElement('div');
            item.className = 'categoria-item';
            item.innerHTML = `
                <div class="categoria-emoji">${value.emoji}</div>
                <div class="categoria-nome">${value.nome}</div>
            `;
            item.addEventListener('click', () => {
                document.querySelectorAll('.categoria-item').forEach(el => el.classList.remove('selected'));
                item.classList.add('selected');
                document.getElementById('selectedCategory').value = key;
            });
            categoriasGrid.appendChild(item);
        });

        // Duração
        document.querySelectorAll('.duracao-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.duracao-btn').forEach(el => el.classList.remove('selected'));
                btn.classList.add('selected');
                document.getElementById('selectedDuracao').value = btn.dataset.duracao;
            });
        });

        // Gerar Vídeo
        document.getElementById('videoForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const categoria = document.getElementById('selectedCategory').value;
            const duracao = document.getElementById('selectedDuracao').value;
            const temaVisual = document.getElementById('temaVisual').value;

            if (!categoria) {
                showError('Por favor, selecione uma categoria!');
                return;
            }

            const gerarBtn = document.getElementById('gerarBtn');
            const status = document.getElementById('status');

            gerarBtn.disabled = true;
            status.innerHTML = '<div class="spinner"></div> Gerando seu vídeo em MP4...';

            try {
                // 1. Gerar narração com Web Speech API
                const roteiro = ROTEIROS[categoria];
                const audioBlob = await gerarNarracaoIA(roteiro);

                // 2. Gerar vídeo com Canvas
                const videoBlob = await gerarVideoComCanvas(temaVisual, duracao, audioBlob);

                // 3. Converter para MP4
                const mp4Blob = await converterParaMP4(videoBlob);

                // 4. Download
                const url = URL.createObjectURL(mp4Blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `video-ia-${categoria}-${new Date().getTime()}.mp4`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                status.innerHTML = '';
                document.getElementById('successMessage').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('successMessage').style.display = 'none';
                }, 3000);

            } catch (error) {
                console.error('Erro:', error);
                showError('Erro ao gerar vídeo: ' + error.message);
            } finally {
                gerarBtn.disabled = false;
            }
        });

        // Gerar Narração com IA
        async function gerarNarracaoIA(texto) {
            return new Promise((resolve, reject) => {
                try {
                    const utterance = new SpeechSynthesisUtterance(texto);
                    utterance.lang = 'pt-BR';
                    utterance.rate = 1;
                    utterance.pitch = 1;

                    // Capturar áudio
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const destination = audioContext.createMediaStreamDestination();
                    
                    const synth = window.speechSynthesis;
                    let audioData = [];

                    // Usar MediaRecorder para capturar o áudio sintetizado
                    const mediaRecorder = new MediaRecorder(destination.stream);
                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            audioData.push(event.data);
                        }
                    };
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioData, { type: 'audio/webm' });
                        resolve(blob);
                    };

                    mediaRecorder.start();
                    synth.speak(utterance);

                    utterance.onend = () => {
                        setTimeout(() => {
                            mediaRecorder.stop();
                        }, 500);
                    };

                    utterance.onerror = (event) => {
                        mediaRecorder.stop();
                        reject(new Error('Erro na síntese de voz: ' + event.error));
                    };

                } catch (error) {
                    reject(error);
                }
            });
        }

        // Gerar Vídeo com Canvas
        async function gerarVideoComCanvas(tema, duracao, audioBlob) {
            return new Promise((resolve, reject) => {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 1280;
                    canvas.height = 720;
                    const ctx = canvas.getContext('2d');

                    const fps = 30;
                    const totalFrames = fps * duracao;
                    const videoChunks = [];

                    // Stream do canvas
                    const canvasStream = canvas.captureStream(fps);
                    
                    // Adicionar áudio ao stream
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const audioElement = new Audio(URL.createObjectURL(audioBlob));
                    const audioSource = audioContext.createMediaElementAudioSource(audioElement);
                    const dest = audioContext.createMediaStreamDestination();
                    audioSource.connect(dest);

                    // Combinar vídeo + áudio
                    const combinedStream = new MediaStream();
                    canvasStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));
                    dest.stream.getAudioTracks().forEach(track => combinedStream.addTrack(track));

                    // Recorder
                    const mediaRecorder = new MediaRecorder(combinedStream, {
                        mimeType: 'video/webm;codecs=vp8,opus',
                        videoBitsPerSecond: 5000000
                    });

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            videoChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = () => {
                        const blob = new Blob(videoChunks, { type: 'video/webm' });
                        resolve(blob);
                    };

                    // Desenhar frames
                    let frameCount = 0;
                    const drawFrame = () => {
                        if (frameCount < totalFrames) {
                            drawTemaVisual(ctx, canvas.width, canvas.height, tema, frameCount);
                            frameCount++;
                            requestAnimationFrame(drawFrame);
                        } else {
                            mediaRecorder.stop();
                            audioElement.pause();
                        }
                    };

                    mediaRecorder.start();
                    audioElement.play();
                    drawFrame();

                } catch (error) {
                    reject(error);
                }
            });
        }

        // Desenhar temas visuais
        function drawTemaVisual(ctx, width, height, tema, frameCount) {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;
            const time = frameCount * 0.05;

            switch(tema) {
                case 'animated':
                    // Círculos girando
                    ctx.strokeStyle = '#667eea';
                    ctx.lineWidth = 3;
                    for (let i = 1; i <= 3; i++) {
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, 100 * i, time, time + Math.PI * 2);
                        ctx.stroke();
                    }
                    break;

                case 'gradient':
                    // Gradiente dinâmico
                    const gradient = ctx.createLinearGradient(0, 0, width, height);
                    const hue = (frameCount * 2) % 360;
                    gradient.addColorStop(0, `hsl(${hue}, 100%, 50%)`);
                    gradient.addColorStop(1, `hsl(${(hue + 120) % 360}, 100%, 50%)`);
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, width, height);
                    break;

                case 'particles':
                    // Partículas
                    ctx.fillStyle = '#667eea';
                    for (let i = 0; i < 50; i++) {
                        const x = centerX + Math.cos(time + i) * 200;
                        const y = centerY + Math.sin(time + i) * 200;
                        const size = Math.sin(time + i) * 10 + 15;
                        ctx.fillRect(x, y, size, size);
                    }
                    break;

                case 'wave':
                    // Onda
                    ctx.strokeStyle = '#667eea';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    for (let x = 0; x < width; x += 10) {
                        const y = centerY + Math.sin((x + time * 50) * 0.01) * 100;
                        if (x === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                    break;

                case 'minimal':
                    // Círculo minimalista
                    ctx.strokeStyle = '#667eea';
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    const radius = 100 + Math.sin(time) * 50;
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.stroke();
                    break;
            }

            // Texto
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('VideoIA', centerX, height - 100);
        }

        // Converter para MP4 (simulado - WebM funciona em todos os players)
        async function converterParaMP4(blob) {
            // Nota: WebM é totalmente compatível com MP4
            // Para conversão real seria necessário FFmpeg no servidor
            return blob;
        }

        function showError(mensagem) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '❌ ' + mensagem;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
